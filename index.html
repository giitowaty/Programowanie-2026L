<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poprawa</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>MovieTracker</h1>
    </header>

    <main>
        <section id="movies">
            <h2>Moje filmy</h2>
            <ul id="movieList">
            </ul>
        </section>

        <section id="movies2025">
            <h2>Filmy z 2025 roku</h2>
            <ul id="movieList2025">
            </ul>
        </section>

        <section>
            <h2>Dodaj film</h2>
            <form>
                <input type="text" id="title" placeholder="Wpisz tytuł filmu...">
                <button>Dodaj</button>
            </form>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
